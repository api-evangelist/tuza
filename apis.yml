aid: tuza
name: Tuza
description: 'Tuza is a banking automation platform that orchestrates AI agents, customers
  and workflows to eliminate the manual processes that slow banks down. Originally launched
  in the UK at tuza.co.uk as a card-payment fee comparison and switching service for
  merchants, the company has repositioned as Tuza AI, delivering agentic automation for
  banks. It is an early-stage, venture-backed fintech (backed by Northzone) building a
  product that connects AI agents with core banking operations and customer-facing
  workflows. As of this profile Tuza publishes a marketing and careers site only — no
  public API, developer portal, SDKs, or documentation surface has been released yet, so
  this record captures verified company identity plus a domain-security probe.'
